tions{display:flex;gap:5px}.list-actions button{white-space:nowrap}.empty{padding:35px 10px;text-align:center;color:#7b8aa0}dialog{border:0;border-radius:24px;width:min(92vw,440px);padding:24px;box-shadow:0 20px 70px #0003}dialog::backdrop{background:#1422397a}label{display:block;font-size:14px;margin:14px 0 6px}form footer{display:flex;gap:9px;margin-top:20px}form footer button{flex:1}#file{display:none}@media(max-width:550px){main{padding:15px 9px 28px}header{gap:6px}.seg{padding:3px}.seg button{font-size:12px;padding:12px 9px}.counts button{font-size:11px;padding:13px 8px}.round{width:43px;height:43px}.card{height:58dvh;min-height:330px}#cards{padding-top:7vh}.hint{margin-top:20px}}@media(prefers-reduced-motion:reduce){.card,.seg button{transition:none}.card.flip,.card.enter{animation:none}}

/* Navy visual theme: presentation only; existing storage and card logic retained */
:root{color:#eaf2ff;background:#101f34;color-scheme:dark}
html{background:#101f34}
body{background:radial-gradient(ellipse 85% 55% at 48% 20%,#223d5c 0%,#142942 52%,#0b1b2e 100%);background-attachment:fixed;color:#eaf2ff}
main{max-width:650px;padding:calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 24px);min-height:100dvh;display:flex;flex-direction:column}

.status{color:#b5d1ed;margin:8px 0 0;min-height:0}
.backup#exportBtn{display:flex;justify-content:center;align-items:center;gap:12px;width:min(92%,490px);margin:24px auto 2px;min-height:66px;border-radius:100px;letter-spacing:.15em;font-size:clamp(11px,3vw,15px);font-weight:450;border:1px solid #52779e;background:linear-gradient(145deg,#1c3856,#10253d);color:#e6f0ff;box-shadow:0 10px 24px #0005}
#exportBtn:before{content:'⇧';font-size:26px;font-weight:250;letter-spacing:0}
#cards:after{content:'‹                     ›';display:block;white-space:pre;text-align:center;color:#9db6d3;font-size:37px;font-weight:200;line-height:1;margin-top:22px;pointer-events:none}

.row{border-color:#46617e}.row small,.empty{color:#a5b8d0}.row button,.secondary{background:#294a6d;color:#e4efff;border:1px solid #476b8e}.primary{background:#3a6593;color:white}
input{background:#0e2239;border:1px solid #527195;color:#f7faff}input::placeholder{color:#9ab1cc}
dialog{background:#172d47;color:#edf5ff;border:1px solid #52779e;max-height:85dvh}dialog::backdrop{background:#030b19b8}
button:focus-visible,.card:focus-visible{outline:2px solid #a7c9f2;outline-offset:3px}
@media(max-width:550px){main{padding:calc(env(safe-area-inset-top) + 16px) 17px calc(env(safe-area-inset-bottom) + 16px)}header{gap:16px 9px}.seg button{font-size:14px;padding:14px 5px}.counts button{font-size:clamp(10px,2.7vw,13px);padding:18px 1px}.round{width:51px;height:51px}.card{height:clamp(300px,53dvh,610px);border-radius:28px}#cards{padding-top:22px}.backup#exportBtn{margin-top:20px;min-height:58px}}
@media(max-height:720px){.card{height:48dvh}#cards{padding-top:14px}.backup#exportBtn{min-height:52px;margin-top:13px}header{gap:11px}}
</style></head><body><main><header><div class="seg" aria-label="Язык на лицевой стороне"><button type="button" id="enMode" class="active">En</button><button type="button" id="ruMode">Ru</button></div><button type="button" class="round" id="addTop" aria-label="Добавить слово">+</button><div class="seg counts"><button type="button" class="active" data-tab="cards" id="studyTab">УЧИТЬ (<span id="learningCount">0</span>)</button><button type="button" data-tab="learned" id="learnedTab">ВЫУЧЕНО (<span id="learnedCount">0</span>)</button></div><button type="button" class="round close" id="closeBtn" aria-label="Закрыть">×</button></header><p id="status" class="status" role="status"></p><section id="cards"><div class="card-shell"><div id="card" class="card" role="button" tabindex="0" aria-label="Перевернуть карточку">Добавьте первое слово</div></div><p class="hint">Нажать — перевернуть · ← следующая · → выучено</p><div class="actions"><button class="secondary" id="skip">← Дальше</button><button class="primary" id="master">Выучено →</button></div><button type="button" class="secondary backup" id="openLearning">Список слов «Учим»</button></section><section id="learning" hidden><div class="listhead"><h2>Учим</h2><button class="secondary" id="importBtn">Импорт Excel / CSV</button></div><input id="searchLearning" placeholder="Поиск" aria-label="Поиск изучаемых слов"><div id="learningList"></div></section><section id="learned" hidden><div class="listhead"><h2>Выучено</h2></div><input id="searchLearned" placeholder="Поиск" aria-label="Поиск выученных слов"><div id="learnedList"></div></section><p class="help">Слова сохраняются на этом устройстве в браузере. Для надёжности периодически экспортируйте копию.</p><button class="secondary backup" id="exportBtn">Экспорт словаря (CSV)</button><input id="file" type="file" accept=".xlsx,.xls,.csv,.tsv" hidden></main><dialog id="addDialog"><form id="wordForm"><h2 id="dialogTitle">Добавить слово</h2><label for="english">Английское слово</label><input id="english" autocomplete="off" required><label for="russian">Перевод</label><input id="russian" autocomplete="off" required><footer><button type="button" class="secondary" id="cancel">Отмена</button><button type="submit" class="primary">Сохранить слово</button></footer></form></dialog><script>
(()=>{'use strict';const $=id=>document.getElementById(id),KEY='moi-slova-data-v3';let words=[],current=null,flipped=false,editing=null,last=null,mode='en',animating=false;try{const stored=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(stored))words=stored.filter(w=>w&&typeof w.en==='string'&&typeof w.ru==='string')}catch(e){message('Не удалось прочитать старый словарь')}
function message(t){$('status').textContent=t;clearTimeout(message.timer);message.timer=setTimeout(()=>$('status').textContent='',4000)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(words));return true}catch(e){message('Ошибка сохранения: проверьте доступ к хранилищу');return false}}
function randomCard(){const pool=words.filter(w=>!w.learned);if(!pool.length){current=null;flipped=false;drawCard();return}let choices=pool.length>1?pool.filter(w=>w.id!==last):pool;current=choices[Math.floor(Math.random()*choices.length)].id;last=current;flipped=false;drawCard()}
function drawCard(){const w=words.find(w=>w.id===current&&!w.learned);$('card').textContent=w?(flipped?( mode==='en'?w.ru:w.en):(mode==='en'?w.en:w.ru)):'Все слова выучены 🎉';$('skip').disabled=$('master').disabled=!w}
function render(){const a=words.filter(w=>!w.learned),b=words.filter(w=>w.learned);$('learningCount').textContent=a.length;$('learnedCount').textContent=b.length;renderList('learningList',a,$('searchLearning').value);renderList('learnedList',b,$('searchLearned').value);if(!words.some(w=>w.id===current&&!w.learned))randomCard();else drawCard()}
function renderList(id,items,query){const root=$(id);root.replaceChildren();items=items.filter(w=>(w.en+' '+w.ru).toLowerCase().includes(query.toLowerCase()));if(!items.length){const p=document.createElement('p');p.className='empty';p.textContent='Здесь пока нет слов';root.append(p);return}for(const w of items){const row=document.createElement('div');row.className='row';const info=document.createElement('div');info.className='rowtext';const strong=document.createElement('strong');strong.textContent=w.en;const small=document.createElement('small');small.textContent=w.ru;info.append(strong,small);const actions=document.createElement('div');actions.className='list-actions';const edit=document.createElement('button');edit.textContent='✎';edit.title='Редактировать';edit.onclick=()=>openForm(w);const move=document.createElement('button');move.textContent=w.learned?'↩ Учим':'✓ Выучено';move.onclick=()=>{w.learned=!w.learned;if(!save()){w.learned=!w.learned;return}render();message('Список обновлён')};const del=document.createElement('button');del.textContent='×';del.title='Удалить';del.onclick=()=>{if(!confirm('Удалить слово «'+w.en+'»?'))return;const old=words;words=words.filter(x=>x.id!==w.id);if(!save()){words=old;return}render()};actions.append(edit,move,del);row.append(info,actions);root.append(row)}}
function tab(name){document.querySelectorAll('main>section[id]').forEach(s=>{if(['cards','learning','learned'].includes(s.id))s.hidden=s.id!==name});$('studyTab').classList.toggle('active',name!=='learned');$('learnedTab').classList.toggle('active',name==='learned');render()}
$('studyTab').onclick=()=>tab('cards');$('studyTab').oncontextmenu=e=>{e.preventDefault();tab('learning')};$('learnedTab').onclick=()=>tab('learned');$('openLearning').onclick=()=>tab('learning');$('enMode').onclick=()=>setMode('en');$('ruMode').onclick=()=>setMode('ru');function setMode(m){mode=m;$('enMode').classList.toggle('active',m==='en');$('ruMode').classList.toggle('active',m==='ru');flipped=false;drawCard()}$('closeBtn').onclick=()=>{if(history.length>1)history.back();else message('Закройте вкладку браузера')};function openForm(w=null){editing=w?.id||null;$('dialogTitle').textContent=w?'Изменить слово':'Добавить слово';$('english').value=w?.en||'';$('russian').value=w?.ru||'';$('addDialog').showModal();$('english').focus()};$('addTop').onclick=()=>openForm();$('cancel').onclick=()=>$('addDialog').close();$('wordForm').addEventListener('submit',e=>{e.preventDefault();const en=$('english').value.trim(),ru=$('russian').value.trim();if(!en||!ru)return;const old=JSON.stringify(words);if(editing){const w=words.find(x=>x.id===editing);if(w){w.en=en;w.ru=ru}}else{words.push({id:String(Date.now())+Math.random(),en,ru,learned:false})}if(!save()){words=JSON.parse(old);return}$('addDialog').close();render();message(editing?'Слово изменено':'Слово добавлено в «Учим» (+1)');editing=null});$('card').onclick=()=>{if(!current||animating||swiped)return;animating=true;const c=$('card');c.classList.remove('enter');c.classList.add('flip');setTimeout(()=>{flipped=!flipped;drawCard()},190);setTimeout(()=>{c.classList.remove('flip');animating=false},390)};$('card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('card').click()}};$('skip').onclick=()=>advance(false);$('master').onclick=()=>advance(true);function advance(learned){if(!current||animating)return;animating=true;const c=$('card');c.classList.remove('enter','flip');c.classList.add(learned?'exit-right':'exit-left');setTimeout(()=>{if(learned){const w=words.find(x=>x.id===current);if(w){w.learned=true;if(!save())w.learned=false}}randomCard();render();c.classList.remove('exit-right','exit-left');c.classList.add('enter');setTimeout(()=>{c.classList.remove('enter');animating=false},300)},235)}let startX=0,startY=0,swiped=false;$('card').addEventListener('touchstart',e=>{startX=e.changedTouches[0].screenX;startY=e.changedTouches[0].screenY},{passive:true});$('card').addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-startX,dy=e.changedTouches[0].screenY-startY;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4){e.preventDefault();swiped=true;if(dx<0)$('skip').click();else $('master').click();setTimeout(()=>swiped=false,450)}},{passive:false});$('searchLearning').oninput=render;$('searchLearned').oninput=render;
$('exportBtn').onclick=()=>{const csv='English,Russian,Learned\n'+words.map(w=>[w.en,w.ru,w.learned?'yes':'no'].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'moi-slova-backup.csv')};function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('importBtn').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{let rows;if(/\.xlsx?$/i.test(f.name)){if(!window.XLSX){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=resolve;s.onerror=reject;document.head.append(s)})}const book=XLSX.read(await f.arrayBuffer(),{type:'array'});rows=XLSX.utils.sheet_to_json(book.Sheets[book.SheetNames[0]],{header:1,defval:''})}else{const t=await f.text();rows=parseCSV(t)}let added=0;for(const row of rows){const en=String(row[0]??'').trim(),ru=String(row[1]??'').trim();if(!en||!ru||(/^(english|английский|слово)$/i.test(en)&&/^(russian|русский|перевод)$/i.test(ru)))continue;if(words.some(w=>w.en.toLowerCase()===en.toLowerCase()&&w.ru.toLowerCase()===ru.toLowerCase()))continue;words.push({id:String(Date.now())+Math.random(),en,ru,learned:false});added++}if(!save())return;render();message('Импортировано слов: '+added)}catch(err){message('Ошибка импорта. Для Excel нужен интернет при первой загрузке.')}finally{e.target.value=''}};
function parseCSV(t){const sep=t.split(/\r?\n/,1)[0].includes('\t')?'\t':t.split(/\r?\n/,1)[0].includes(';')?';':',';const out=[];let row=[],cell='',quoted=false;for(let i=0;i<t.length;i++){const c=t[i];if(c==='"'){if(quoted&&t[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===sep&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell);out.push(row);row=[];cell=''}else cell+=c}row.push(cell);out.push(row);return out}render();})();
</script></body></html>
